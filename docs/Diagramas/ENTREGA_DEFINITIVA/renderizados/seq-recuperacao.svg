text x="1539.0" y="723">18  query(&quot;SELECT id, reset_token, reset_token_expires FROM users ...&quot;)</text><line x1="1529.0" y1="729" x2="2413.0" y2="729" stroke="#334155" marker-end="url(#ah)"/><text x="1537.0" y="751">19  bcrypt.hashSync(newPassword, 10)</text><path d="M1529.0 757 h30 v14 h-30" fill="none" stroke="#334155" marker-end="url(#ah)"/><text x="1539.0" y="787">20  query(&quot;UPDATE users SET password_hash=$1, reset_token=NULL WHERE reset_token=$3 AND reset_token_expires &gt; NOW()&quot;)</text><line x1="1529.0" y1="793" x2="2413.0" y2="793" stroke="#334155" marker-end="url(#ah)"/><text x="1539.0" y="815">21  query(&quot;DELETE FROM auth_sessions WHERE user_id = $1&quot;)</text><line x1="1529.0" y1="821" x2="2413.0" y2="821" stroke="#334155" marker-end="url(#ah)"/><text x="1278.0" y="843">22  200 {success} | 400 {error}</text><line x1="1529.0" y1="849" x2="1268.0" y2="849" stroke="#334155" stroke-dasharray="6 4" marker-end="url(#ah)"/><text x="884.0" y="871">23  {success}</text><line x1="1268.0" y1="877" x2="874.0" y2="877" stroke="#334155" stroke-dasharray="6 4" marker-end="url(#ah)"/><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
